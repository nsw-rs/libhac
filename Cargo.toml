[package]
name = "libhac"
version = "0.1.0"
edition = "2024"
rust-version = "1.89"
description = "Nintendo Switch file format library (Rust port of LibHac)"
license = "MIT OR Apache-2.0"
authors = ["Timothy Redaelli <timothy.redaelli@gmail.com>"]
repository = "https://github.com/nsw-rs/libhac"
readme = "README.md"
keywords = ["nintendo-switch", "nca", "nsp", "romfs", "pfs0"]
categories = ["parser-implementations", "filesystem"]

[dependencies]
aes = "0.9.3"
hex = "0.4.3"
lz4_flex = { version = "0.14.0", default-features = false, features = ["safe-decode"] }
rsa = { version = "0.9.10", features = ["sha2"] }
serde = { version = "1.0", features = ["derive"], optional = true }
serde_json = { version = "1.0", optional = true }
sha2 = "0.10"
thiserror = "2.0.21"
zstd = { version = "0.14", default-features = false, optional = true }

[features]
# NCZ/XCZ (nsz) decompression: block compressed NCZ reader and virtual
# NSP/XCI images of NSZ/XCZ containers.
ncz = ["dep:serde", "dep:serde_json", "dep:zstd"]

[package.metadata.docs.rs]
all-features = true
